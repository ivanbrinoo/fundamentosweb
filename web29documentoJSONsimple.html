<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function mostrarjsonsimple(){
            let ruta = "documents/tareas.json";
            let respuesta = await fetch(ruta);
            let datos = await respuesta.json();
            console.log(datos);
            let resultado = document.getElementById("resultado");
            // let uno = datos.UNO;
            // let dos = datos.DOS;
            // resultado.innerHTML = uno + ", " + dos;
            resultado.innerHTML = datos.UNO + ", " + datos.DOS + ", " 
            + datos.TRES + ", " + datos.CUATRO + ", " + datos.CINCO + ", "
             + datos.SEIS;
        }

    </script>
</head>
<body>
    <h1>Visualizando un documento JSON</h1>
    <button onclick="mostrarjsonsimple()">Leer JSON</button>
    <p id="resultado"></p>
</body>
</html>
