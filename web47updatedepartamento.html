<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Departamento</title>
    <script>
        let url = "https://apicruddepartamentoscore.azurewebsites.net/"
        async function modificarDepartamento(){
            let ruta = url + "api/Departamentos/";
            console.log(ruta)
            let cajanumero = document.getElementById("numero");
            let cajanombre = document.getElementById("nombre");
            let cajalocalidad = document.getElementById("localidad");
            let nuevo = {
                "Numero" : parseInt(cajanumero.value),
                "Nombre" : cajanombre.value,
                "Localidad" : cajalocalidad.value
            }
            let data = JSON.stringify(nuevo);
            let respuesta = await fetch(ruta, {
                "method" : "PUT",
                "body" : data,
                "headers" : {
                    "Content-type" : "application/json"

                }
            })
            alert ("Modificado");
        }
    </script>
</head>
<body>
    <h1>Vamos a modificar un departamento</h1>
    ID: <input type="numero" id="numero"><br/>
    Nombre: <input type="text" id="nombre"><br/>
    Localidad: <input type="text" id="localidad"><br/>
    <button onclick="modificarDepartamento()">Modificar Departamento</button>
</body>
</html>
