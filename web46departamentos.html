<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apicruddepartamentoscore.azurewebsites.net/";
        async function mostrarDepartamentos() {
            let ruta = url + "api/Departamentos";
            let respuesta = await fetch(ruta);
            let datos = await respuesta.json();
            let contenido = "";
            for (persona of datos)
                contenido += `
                <tr>
                    <td> ${persona.numero} </td>
                    <td> ${persona.nombre} </td>
                    <td> ${persona.localidad} </td>
                </tr>
                `
                let mostrar = document.getElementById("lista")
                mostrar.innerHTML = contenido;
        }
        async function borrarDepartamentos(){
            let cajaid = document.getElementById("cajaid");
            let ruta = url + "api/Departamentos/" + cajaid.value;
            let respuesta = await fetch(ruta,{
                "method" : "DELETE"

            })
            mostrarDepartamentos();
        }
    </script>
</head>
<body>
    <h1>Cargar lista de departamentos</h1>
    Introduce el ID del departamento a borrar: <input type="number" id="cajaid"><br/><br/>
    <button onclick="mostrarDepartamentos()">Mostrar Departamentos</button>
    <button onclick="borrarDepartamentos()">Borrar Departamentos</button>
    <table id="lista" border="1px"></table>
    <div id="respuestaborrar"></div>
</body>
</html>
