<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        td{
            text-align: center;
        }
    </style>
    <script>
        async function mostrarjugadores(){
            let ruta = "documents/jugadores.json";
            let respuesta = await fetch(ruta);
            let datos = await respuesta.json();
            let contenido = "";
                contenido += "<table border='1'>";            
                console.log(datos);
                    for(cliente of datos){
                        // contenido += "<tr>";
                        // contenido += "<td>" + cliente.jugador + "</td>"
                        //  contenido += "<td><img src='" + cliente.imagen + 
                        //     "' alt='" + cliente.jugador + "' width='250px'></td>";
                        // contenido += "</tr>"
                        contenido += `
                            <tr>
                                <td>${cliente.jugador}</td>
                                <td><img src="${cliente.imagen}" width="250px"></td>
                            </tr>
                        `
                    }
            contenido += "</table>";        
            let resultado = document.getElementById("resultado");
            resultado.innerHTML = contenido;
        }
    </script>
</head>
<body>
    <h1>Estos son los jugadores:</h1>
    <button onclick="mostrarjugadores()">Mostrar Jugadores</button>
    <h2 id="resultado"></h2>
    <table border="1">

            <td>Sergio Ramos</td>
        </tr> -->
    </table>
</body>
</html>
