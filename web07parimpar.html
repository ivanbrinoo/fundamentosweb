<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function evaluarNumero(){
            let numero = 10;
                if (numero % 2 == 0) {
                    alert("El número es par");
                } else {
                    alert("El número es impar");
                }
            } 
        function evaluarNumero2(){
            let numero2 = 40;
                if (numero2 % 2 == 0) {
                    alert("El número es par");
                } else {
                    alert("El número es impar");
                }
        }
    
    </script>
</head>
<body>
    <h1>Es par o impar?</h1>
    <button onclick="evaluarNumero()">Evaluar número</button>
    <br/><br/>
    <button onclick="evaluarNumero2()">Evaluar número 2</button>
</body>
</html>
