<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
            let url ="https://services.odata.org/V4/Northwind/Northwind.svc/Suppliers";
        async function supplier(){            
            let respuesta = await fetch(url);
            let datos = await respuesta.json();
            let id = document.getElementById("idsupplier");
            let contenido = "";
            let options = "";
            console.log(datos)
            for (let id of datos.value){
                options += `
                    <option value="${id.SupplierID}"> ${id.ContactName} </option>
                `
                contenido += `
                    <ul> ID: ${id.SupplierID} </ul>
                    <ul> Nombre de Contacto: ${id.ContactName} </ul>
                `
                let select = document.getElementById("selectsupplier");
                select.innerHTML = options;
                let mostrar = document.getElementById("resultado");
                mostrar.innerHTML = contenido;
            }
        }
        async function buscarSupplier(){
             // 1. Obtener el ID que escribió el usuario en el input y convertirlo a número
            let idBuscado = parseInt(document.getElementById("selectsupplier").value);
            
            // 2. Hacer la petición a la API para traer todos los proveedores
            let respuesta = await fetch(url);
            let datos = await respuesta.json();
            
            let contenido = "Proveedor no encontrado"; // Mensaje por defecto si no hay coincidencia
            
            // 3. Recorrer los proveedores con un bucle
            for (let sup of datos.value){
                // 4. El "if" evalúa si el SupplierID actual coincide con el ID que buscas
                if (sup.SupplierID === idBuscado) {
                    contenido = `
                        <ul>ID: ${sup.SupplierID}</ul>
                        <ul>Nombre de Contacto: ${sup.ContactName}</ul>
                    `;
                    
                }
                let mostrar = document.getElementById("resultado");
                mostrar.innerHTML = contenido;
        }
    }   
    </script>
</head>
<body>
    <h1 style="color:blue">Suppliers V2</h1>
    Selecciona un supplier: <select id="selectsupplier"></select><br/><br/>
    <button onclick="buscarSupplier()">Buscar Supplier</button>
    <button onclick="supplier()">Ver Supplier</button>
    <p id="resultado"></p>
</body>
</html>
