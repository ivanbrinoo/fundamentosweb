<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function evaluarNumeroMayor(){
            let numero1 = 50;
            let numero2 = 100;
                if (numero1 > numero2) {
                    alert ("El numero es mayor: " + numero1)
                }else if (numero1 == numero2) {
                    alert ("Los numeros son iguales: " + numero1)
                }else {
                    alert ("El numero es menor: " + numero2)
                }
        }
    </script>
</head>
<body>
    <h1>¿Cuál es el número mayor?</h1>
    <button onclick="evaluarNumeroMayor()">Evaluar números</button>
</body>
</html>
