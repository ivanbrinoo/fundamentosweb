<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        async function mostrarApellidos(){
            let apellidos = document.getElementById("cajaselect");
            let cajaapellidos = apellidos.value;
            let url = `https://apiempleadosfullstack.azurewebsites.net/api/Empleados`
            let respuesta = await fetch(url);
            let datos = await respuesta.json();
            let contenido = "";
            for (let apellido of datos)
                contenido += `
                <option>${apellido.apellido} </option>
            `
            let mostrar = document.getElementById("cajaselect")
            mostrar.innerHTML = contenido;
        }
        async function buscarEmpleado(){
            let url = `https://apiempleadosfullstack.azurewebsites.net/api/Empleados/`
        }
    </script>
</head>
<body>
    <h1>Seleccionar empleado con API</h1>
    <select id="cajaselect">Apellidos</select>
    <button onclick="mostrarApellidos()">Apellidos</button>
    <button onclick="buscarEmpleado()">Buscar empleado</button>
    <div id="respuesta"></div>
</body>
</html>
