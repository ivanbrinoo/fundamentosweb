<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        
        async function empleados(){
            let url = "https://apiempleadosfullstack.azurewebsites.net/api/Empleados"
            let respuesta = await fetch(url);
            let datos = await respuesta.json();
            let contenido = `
                <tr>
                    <td style="font-weight: bold;">ID</td>
                    <td style="font-weight: bold;">Apellido</td>
                    <td style="font-weight: bold;">Puesto</td>
                    <td style="font-weight: bold;">Salario</td>
                    <td style="font-weight: bold;">Departamento</td>
                </tr>
            `;
            for (let empleado of datos)
                contenido += `
                    <tr>
                        <td> ${empleado.idEmpleado} </td>    
                        <td> ${empleado.apellido} </td>
                        <td> ${empleado.oficio} </td>
                        <td> ${empleado.salario} </td>
                        <td> ${empleado.departamento} </td>
                    </tr>
                `
                let mostrar = document.getElementById("respuesta");
                mostrar.innerHTML = contenido;
        }
        async function buscarEmpleados(){
            // let respuesta = await fetch(url);
            // let datos = await respuesta.json();
            // let contenido = "";
            // let cajaempleado = parseInt(document.getElementById("cajaid").value)
            // for (let empleado of datos){
            //     if (cajaempleado == empleado.idEmpleado){
            //         contenido += `
            //             <p> ID: ${empleado.idEmpleado} </p>
            //             <p> Apellido: ${empleado.apellido} </p>
            //             <p> Salario: ${empleado.salario} </p>
            //         `
            //     }
            // }
            // let mostrar = document.getElementById("datosempleado");
            // mostrar.innerHTML = contenido;
            //BUSCAMOS LA CAJA DONDE TENEMOS EL ID
            let cajaid = document.getElementById("cajaid");
            //recuperamos el ID del empleado que esta en la cajaid
            let idempleado = cajaid.value; //7839
            let url = 
            `https://apiempleadosfullstack.azurewebsites.net/api/Empleados/${idempleado}`
            //realizamos la petición al servicio
            let response = await fetch(url);
            //convertimos los datos a json
            let datos = await response.json();
            //ya tenemos al empleado en datos, simplemente dibujamos
            //buscamos el div del html
            let div = document.getElementById("datosempleado");
            //realizamos el dibujo
            div.innerHTML = `
                <p> Apellido: ${datos.apellido} </p>
                <p> Puesto de trabajo: ${datos.oficio} </p>
                <p> Salario: ${datos.salario} </p>
            `
        }
    </script>
    <style>
        table{
            padding: 12px;
            border-radius: 12px;
        }
        td{
            width: 100px;
            border-collapse: separate;
            text-align: center;
            padding: 12px;
            border: 0px;
        }
        button{
            width: 100px;
            height: 40px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <h1>Esta es la pagina de la API empleados</h1>
    <br/>
    Introduce el ID del empleado: <input type="number" id="cajaid"><br/><br/>
    <button onclick="empleados()">Empleados</button>
    <br/>
    <button onclick="buscarEmpleados()">Buscar Empleados</button>
    <table border="1px" id="respuesta"></table>
    <div id="datosempleado"></div>
</body>
</html>
