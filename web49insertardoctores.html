<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apicruddoctores.azurewebsites.net/"
        async function insertarDoctores(){
            let ruta = url + "api/Doctores";
            let doctor = {
                "idDoctor" : parseInt(document.getElementById("iddoctor").value),
                "idHospital" : parseInt(document.getElementById("idhospital").value),
                "apellido" : document.getElementById("apellido").value,
                "especialidad" : document.getElementById("especialidad").value,
                "salario" : parseInt(document.getElementById("salario").value),
            }
            let data = JSON.stringify(doctor);

            let respuesta = await fetch(ruta, {
                "method" : "POST",
                "body" : data,
                "headers" : {
                    "Content-Type": "application/json"
                }
            });
            cargarDoctores();
        }
        async function cargarDoctores(){
            let ruta = url + "api/Doctores";
            console.log(ruta);
            let respuesta = await fetch(ruta);
            let datos = await respuesta.json();
            let contenido = "";
            for (doctor of datos){
                contenido += `
                    <tr>
                        <td> ${doctor.idDoctor} </td>
                        <td> ${doctor.idHospital} </td>
                        <td> ${doctor.apellido} </td>
                        <td> ${doctor.especialidad} </td>
                        <td> ${doctor.salario} </td>
                    </tr>
                `
            }
            let mostrar = document.getElementById("tabladoctores");
            mostrar.innerHTML = contenido;
        }
        async function modificarDoctor() {
            let ruta = url + "api/Doctores";
            let doctor = {
                "idDoctor" : parseInt(document.getElementById("iddoctor").value),
                "idHospital" : parseInt(document.getElementById("idhospital").value),
                "apellido" : document.getElementById("apellido").value,
                "especialidad" : document.getElementById("especialidad").value,
                "salario" : parseInt(document.getElementById("salario").value),
            }
            let respuesta = await fetch(ruta, {
                "method" : "PUT",
                "body" : JSON.stringify(doctor),
                "headers" : {
                    "content-type" : "application/json"
                }
            })
            cargarDoctores();
        }
        async function eliminarDoctor(){
            let ruta = url + "api/Doctores"
            let doctor = {
                "idDoctor" : parseInt(document.getElementById("iddoctor").value),
                "idHospital" : parseInt(document.getElementById("idhospital").value),
                "apellido" : document.getElementById("apellido").value,
                "especialidad" : document.getElementById("especialidad").value,
                "salario" : parseInt(document.getElementById("salario").value),
            }
            let respuesta = await fetch(ruta, {
                "method" : "DELETE",
                "body" : JSON.stringify(doctor),
                "headers" : {
                    "Content-Type": "application/json"
                }
            })
            cargarDoctores();
        }
    </script>
</head>
<body>
    <h1>Insertar Doctores</h1>
    Ingrese el ID del doctor: <input type="text" id="iddoctor"/><br/>
    Ingrese el ID del hospital: <input type="text" id="idhospital"/><br/>
    Ingrese el apellido del doctor: <input type="text" id="apellido"><br/>
    Ingrese la especialidad del doctor: <input type="text" id="especialidad"/><br/>
    Ingrese el salario: <input type="text" id="salario"><br/>
    <button onclick="insertarDoctores()">Insertar Doctores</button>
    <button onclick="cargarDoctores()">Cargar Doctores</button>
    <button onclick="modificarDoctor()">Modificar Doctor</button>
    <button onclick="eliminarDoctor()">Eliminar Doctor</button>
    <table id="tabladoctores" border="1"></table>
</body>
</html>
