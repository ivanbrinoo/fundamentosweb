<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let url = "https://apiplantillacore.azurewebsites.net/"
        async function cargarPlantilla(){
            let ruta = url + "api/Plantilla"
            let respuesta = await fetch(ruta);
            let datos = await respuesta.json();
            let contenido = "";
            for (let persona of datos){
                contenido += `
                    <p> ID del empleado: ${persona.idEmpleado} </p>
                    <p> Apellido del empleado: ${persona.apellido} </p>
                    <p> Puesto del empleado: ${persona.funcion} </p>
                    <p> Turno del empleado: ${persona.turno} </p>
                    <p> Salario del empleado: ${persona.salario} </p>
                    <br/><br/>
                `
                let mostrar = document.getElementById("resultado");
                mostrar.innerHTML = contenido;
            }
        }
        async function escribirFuncion(){
            let cajatexto = document.getElementById("funcion").value;
            let path = url + "api/Plantilla/PlantillaFuncion/" + cajatexto;
            let response = await fetch(path);
            let datos = await response.json();
            let contenido = "";
            for (let funcion of datos)
                contenido += `
                    <p style="color: blue"> ID del empleado: ${funcion.idEmpleado} </p>
                    <p style="color: blue"> Apellido del empleado: ${funcion.apellido} </p>
                    <p style="color: blue"> Puesto del empleado: ${funcion.funcion} </p>
                    <p style="color: blue"> Turno del empleado: ${funcion.turno} </p>
                    <p style="color: blue"> Salario del empleado: ${funcion.salario} </p>
                    <br/><br/>
                    
                `
                let show = document.getElementById("resultado");
                show.innerHTML = contenido;
        }
        async function mostrarDesplegable(){
            let ruta = url + "api/Plantilla"
            let respuesta = await fetch(ruta);
            let datos = await respuesta.json();
            let contenido = "";
            for (let persona of datos){
                contenido += `
                    <option> ${persona.apellido} </option>
                    <br/><br/>
                `
                let mostrar = document.getElementById("desplegable");
                mostrar.innerHTML = contenido;
        }
    }
    </script>
</head>
<body>
    <h1>Esto es el encabezado de la pagina web de API de Plantillas</h1>
    Escribe el nombre de la funcion <input type="text" id="funcion">
    <select id="desplegable"></select>
    <br/><br/>
    <button onclick="cargarPlantilla()">Cargar Plantilla</button>
    <button onclick="escribirFuncion()">Escribir Funcion</button>
    <button onclick="mostrarDesplegable()">Mostrar Desplegable</button>
    <div id="resultado">

    </div>
</body>
</html>
