<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function evaluarMayorMenor(){
            //recuperamos los numeros de cada caja input
            let numero1 = parseInt(document.getElementById("numero1").value);
            let numero2 = parseInt(document.getElementById("numero2").value);
            let numero3 = parseInt(document.getElementById("numero3").value);
            //debemos aveeriguar cual es el mayor y cual es el menor
            let mayor = 0;
            let menor = 0;
            if(numero1 > numero2 && numero1 > numero3){
                mayor = numero1;
            }else if(numero2 > numero1 && numero2 > numero3){
                mayor = numero2;
            }else{
                mayor = numero3;
            }
            //recuperamos el elemento mensaje de html
            let mensaje = document.getElementById("mensaje");
            //evaluar que numero de los tres es menor
            if(numero1 < numero2 && numero1 < numero3){
                menor = numero1;
            }else if(numero2 < numero1 && numero2 < numero3){
                menor = numero2;
            }else{
                menor = numero3;
            }
            //mostramos los resultados
            mensaje.innerHTML = "El mayor es: " + mayor + " y el menor es: " + menor;
            
        }
    </script>
</head>
<body>
    Primer Numero: <input type="number" id="numero1">
    <br/><br/>
     Segundo Numero: <input type="number" id="numero2">   
     <br/><br/>
     Tercer Numero: <input type="number" id="numero3">
     <br/><br/>
     <button onclick="evaluarMayorMenor()">Mayor/Menor</button>
     <br/><br/>
     <h3 id="mensaje">Resultado</h3>
</body>
</html>
