<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            margin: 5px;
        }
    </style>
    <script>
        // Arreglo modificado solo con las dos imágenes requeridas
        let imagenes = ["01.jpg", "02.jpg", "03.jpg", "04.jpg"];

        // Llenamos el select al cargar la página
        window.onload = function () {
            let select = document.getElementById("selectImagenes");
            let contenido = "";
            
            for (let imagen of imagenes) {
                contenido += "<option value='" + imagen + "'>" + imagen + "</option>";
            }
            
            select.innerHTML = contenido;

            // Opcional: Ejecuta la función una vez al inicio para que muestre la primera imagen por defecto
            actualizarImagenes();
        }

        // Función que cambia el src de todos los elementos img
        function actualizarImagenes(){
            let select = document.getElementById("selectImagenes");
            let imagenSeleccionada = select.value; 
            
            let todasLasImgs = document.getElementsByTagName("img");
            
            for (let img of todasLasImgs) {
                img.src = "imagenes/" + imagenSeleccionada;
            }
        }
    </script>
</head>
<body>
    <h1>Array con Imagenes</h1>
    <!-- Se añade 'onchange' para capturar el cambio al instante sin usar un botón -->
    Seleccione una imagen: <select id="selectImagenes" onclick="actualizarImagenes()"></select>
    <br/><br/>
    <img />
    <img />
    <img />
    <img />
    <img />
    <img />
</body>
</html>
